# Type check for the desktop app: `cd desktop && python3 -m mypy` (CI runs the same).
[mypy]
python_version = 3.12
files = .
exclude = (^test_|^make_icon\.py$)
ignore_missing_imports = True
# PyQt6's stubs mark almost every returned widget, layout and item as Optional; checking each one is noise.
disable_error_code = union-attr

# History, Settings and the result column are mixins of PromptaWindow: they use the window's attributes,
# which mypy cannot see from the mixin. Splitting them into widgets of their own (as target_selector.py is)
# is what removes this exception.
[mypy-history_view,window_settings,window_result]
disable_error_code = union-attr, attr-defined, has-type
