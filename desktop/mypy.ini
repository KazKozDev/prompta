# Type check for the desktop app: `cd desktop && python3 -m mypy` (CI runs the same).
[mypy]
python_version = 3.12
files = .
exclude = (^test_|^make_icon\.py$)
ignore_missing_imports = True
# PyQt6's stubs mark almost every returned widget, layout and item as Optional; checking each one is noise.
disable_error_code = union-attr

