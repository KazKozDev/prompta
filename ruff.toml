# Python lint and format for the desktop app and the rule/catalog scripts.
# CI runs `ruff check .` and `ruff format --check .`; run `ruff format .` before committing.
target-version = "py312"
line-length = 120
# Third-party snapshots kept byte-for-byte as downloaded.
extend-exclude = ["skill_rules/snapshots"]

[format]
quote-style = "preserve"  # the code mixes quotes; reformatting them all would bury real changes

[lint]
extend-select = ["E501"]  # line length, checked at line-length above
# Short names like `l` and named lambdas are style, not bugs.
ignore = ["E741", "E731"]

[lint.per-file-ignores]
# Tests put desktop/ on sys.path before importing; library.py imports its Qt half late.
"desktop/test_*.py" = ["E402"]
"desktop/library.py" = ["E402"]
# Technique templates are prompt text: kept whole so the generated catalog stays byte-for-byte the same.
"catalog/build_catalog.py" = ["E501"]
