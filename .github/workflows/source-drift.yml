name: source-drift

# Once a week, downloads the official guides again (with the same refresh_sources.py) and compares the snapshots
# with the saved ones. If a source changed, the run fails: rules built on the old text
# must be rechecked and updated by hand. The run itself commits nothing.
# Grok is checked by a separate read-only script (grok_prompt_rules/check_sources.py): its snapshots were downloaded by hand.

on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        provider: [claude, chatgpt, gemini]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the guides again
        run: python3 ${{ matrix.provider }}_prompt_rules/refresh_sources.py
      - name: Compare snapshots
        run: |
          if git diff --quiet -- '${{ matrix.provider }}_prompt_rules/snapshots'; then
            echo "${{ matrix.provider }} sources have not changed."
          else
            git diff --stat -- '${{ matrix.provider }}_prompt_rules/snapshots'
            git diff -- '${{ matrix.provider }}_prompt_rules/snapshots' > drift-${{ matrix.provider }}.diff
            echo "::error::The official ${{ matrix.provider }} guides changed: recheck rules.json and update the snapshots with refresh_sources.py"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: drift-${{ matrix.provider }}
          path: drift-${{ matrix.provider }}.diff
          if-no-files-found: ignore

  grok:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Grok snapshots against docs.x.ai
        run: python3 grok_prompt_rules/check_sources.py
