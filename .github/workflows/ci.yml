name: ci

on:
  push:
    branches: ['**']  # version tags go to release.yml
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencies
        run: npm install --no-audit --no-fund
      - name: Types
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python lint
        run: |
          python3 -m pip install --quiet ruff==0.12.2
          ruff check .
          ruff format --check .
      - name: Catalog
        run: python3 catalog/validate.py

  app-bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python dependencies
        run: python3 -m pip install --quiet -r desktop/requirements-dev.txt
      - name: Types
        run: cd desktop && python3 -m mypy
      - name: Desktop tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cd desktop && python3 -m pytest -q
      - name: Screens
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 desktop/screenshots.py screens
      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: screens/*.png
      - name: Build .app
        run: ./desktop/build_app.sh
      - name: Standalone .app
        run: ./desktop/build_standalone.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Prompta-dmg
          path: release/standalone/Prompta.dmg
