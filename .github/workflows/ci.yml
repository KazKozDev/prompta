name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencies
        run: npm install --no-audit --no-fund
      - name: Types
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Catalog
        run: python3 catalog/validate.py

  app-bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PyQt6
        run: python3 -m pip install --quiet PyQt6 Pillow
      - name: Desktop tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 -m pip install --quiet pytest
          cd desktop && python3 -m pytest -q test_history.py test_app.py test_mcp_settings.py
      - name: Build .app
        run: ./desktop/build_app.sh
